# freezerMon provisioned alert rules (Grafana unified alerting, apiVersion 1).
# Contact point + policy: contactpoints.yml (Signal via infra/alert-relay).
apiVersion: 1

groups:
  - orgId: 1
    name: freezermon
    folder: FreezerMon
    interval: 1m
    rules:
      - uid: fm-temp-high
        title: Cabinet temperature high
        condition: C
        for: 10m
        noDataState: OK          # silence is the offline rule's job — NoData here only produced spurious alarm/resolved pairs
        execErrState: OK
        annotations:
          summary: 'Cabinet {{ printf "%.1f" $values.B.Value }} °C — limit 8 °C ({{ $labels.device }})'
        data:
          # keep() trims the frame to a wide numeric series (_time,_value + the device label);
          # Grafana's expression engine rejects Flux tables with string columns ("got type long").
          # NB: never put a # comment INSIDE the query block — it becomes part of the Flux text.
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                from(bucket: "telemetry")
                  |> range(start: -30m)
                  |> filter(fn: (r) => r._measurement == "telemetry" and r._field == "t_cab")
                  |> group(columns: ["device"])
                  |> last()
                  |> keep(columns: ["_time", "_value", "device"])
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [8] }   # cooler food-safety ceiling — keep in sync with TEMP_ALARM_C in firmware config.h

      - uid: fm-device-stale
        title: Device offline / no data
        condition: C
        for: 5m                  # threshold is already 15 min of silence; 5 more minutes of confirmation, not 15
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: 'Last report {{ printf "%.0f" $values.B.Value }} s ago — unit offline, out of coverage, or out of battery ({{ $labels.device }})'
        data:
          # per-device staleness: seconds since each unit's last report.
          # A device that vanishes still has a row (from the 30-day lookback), so
          # ONE stale unit in a fleet fires the alert — count()-based checks
          # only catch the whole fleet going silent.
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                from(bucket: "telemetry")
                  |> range(start: -30d)
                  |> filter(fn: (r) => r._measurement == "telemetry" and r._field == "t_cab")
                  |> group(columns: ["device"])
                  |> last()
                  |> map(fn: (r) => ({ r with _value: float(v: int(v: now()) - int(v: r._time)) / 1000000000.0 }))
                  |> keep(columns: ["_time", "_value", "device"])
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [900] }

      - uid: fm-probe-missing
        title: Cabinet probe missing
        condition: C
        for: 5m
        noDataState: OK          # no frames at all is the offline rule's job
        execErrState: OK
        annotations:
          summary: 'No cabinet temperature for 15 min while the unit keeps reporting — probe unplugged or failed ({{ $labels.device }})'
        data:
          # 1 when frames arrived in the last 15 min but none carried t_cab; wide series (_time,_value,device)
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                from(bucket: "telemetry")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "telemetry" and (r._field == "fw" or r._field == "t_cab"))
                  |> group(columns: ["device", "_field"])
                  |> count()
                  |> pivot(rowKey: ["device"], columnKey: ["_field"], valueColumn: "_value")
                  |> map(fn: (r) => ({ device: r.device, _time: now(), _value: if exists r.t_cab then 0.0 else (if exists r.fw then 1.0 else 0.0) }))
                  |> group(columns: ["device"])
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.5] }
      - uid: fm-batt-low
        title: Battery low
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: 'Battery {{ printf "%.0f" $values.B.Value }} mV — below 3400 mV, recharge or connect power ({{ $labels.device }})'
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                from(bucket: "telemetry")
                  |> range(start: -30m)
                  |> filter(fn: (r) => r._measurement == "telemetry" and r._field == "vbat_mv")
                  |> group(columns: ["device"])
                  |> last()
                  |> keep(columns: ["_time", "_value", "device"])
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [3400] }
