name: freezermon

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"   # plaintext MQTT stays on the host only; devices reach the broker over 8883/TLS (Traefik or the
                                # mosquitto.conf TLS listener). Bind 0.0.0.0 ONLY for a LAN-only test with the plain firmware env.
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    # NOT published to the host — only Telegraf and Grafana reach it internally.
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-freezermon}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: 365d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set in .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.31
    restart: unless-stopped
    depends_on: [mosquitto, influxdb]
    environment:
      # read-only ingest identity (see mosquitto/config/acl) — never the device credential
      MQTT_USER: ${TELEGRAF_MQTT_USER:-telegraf}
      MQTT_PASSWORD: ${TELEGRAF_MQTT_PASSWORD:?set in .env}
      INFLUX_TOKEN: ${TELEGRAF_INFLUX_TOKEN:?set in .env}   # write-only token for the telemetry bucket (never the admin token)
      INFLUX_ORG: ${INFLUX_ORG:-freezermon}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on: [influxdb]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Viewer"   # new users (operator) are read-only
      INFLUX_ORG: ${INFLUX_ORG:-freezermon}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
      INFLUX_TOKEN: ${GRAFANA_INFLUX_TOKEN:?set in .env}    # read-only token; a compromised Grafana cannot delete history or mint tokens
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # --- Alerts -> Signal ---------------------------------------------------------
  # signal-cli-rest-api holds a Signal account (link it as a secondary device of your
  # own account: README §Alerting). Its API has no auth, so it is only reachable from
  # inside this compose network and, for the one-time QR link, from the host's loopback.
  signal:
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    environment:
      MODE: native
    ports:
      - "127.0.0.1:8080:8080"    # loopback only: ssh -L 8080:127.0.0.1:8080 <host> to scan the link QR
    volumes:
      - signal-data:/home/.local/share/signal-cli

  alert-relay:                   # Grafana webhook contact point -> Signal message
    build: ./alert-relay
    restart: unless-stopped
    depends_on: [signal]
    environment:
      SIGNAL_URL: http://signal:8080
      SIGNAL_NUMBER: ${SIGNAL_NUMBER:?set in .env}
      SIGNAL_RECIPIENTS: ${SIGNAL_RECIPIENTS:?set in .env}

volumes:
  signal-data:
  mosquitto-data:
  influxdb-data:
  grafana-data:
